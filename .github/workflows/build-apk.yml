name: Build Android APK & Go Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go Backend Binary
        run: go build -o sahand-icando-server main.go

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17 (Required for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor & Generate Android Project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Compile Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sahand-ICanDo-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Go Server Binary
        uses: actions/upload-artifact@v4
        with:
          name: Sahand-ICanDo-Go-Ubuntu-Server
          path: sahand-icando-server
